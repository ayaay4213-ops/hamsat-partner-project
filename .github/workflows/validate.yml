name: Validate Hamsat

on:
  push:
    branches:
      - 'build/**'
      - 'feature/**'
      - 'work/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate project files
        run: node scripts/validate.mjs
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check moderation and LiveKit Edge Functions
        run: |
          deno check supabase/functions/admin-user-moderate/index.ts
          deno check supabase/functions/livekit-token/index.ts
          deno check supabase/functions/admin-user-directory/index.ts
