name: HAMSAT validation

on:
  push:
    branches:
      - integration/hamsat-consolidation-2026-11-25
  pull_request:
    branches:
      - integration/hamsat-consolidation-2026-11-25

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run HAMSAT validator
        run: node scripts/validate.mjs
